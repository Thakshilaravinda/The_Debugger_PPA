<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Transport Report</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body { margin:0; background-color:#1e1e1e; font-family:Arial,sans-serif; color:white; }
.sidebar { width:220px; height:100vh; background:#2c2c2c; display:flex; flex-direction:column; position:fixed; top:0; left:0; padding-top:40px; }
.sidebar a { color:#ccc; padding:15px 25px; text-decoration:none; display:flex; align-items:center; gap:12px; border-left:4px solid transparent; transition:all 0.3s; }
.sidebar a.active { background:linear-gradient(135deg,#ff416c,#ff4b2b); color:#fff; font-weight:bold; border-left:4px solid #fff; }
.sidebar a:hover:not(.active) { background-color:#3a3a3a; color:#fff; border-left:4px solid #ff416c; }
.main-content { margin-left:220px; padding:20px; }
h1 { margin-bottom:20px; }
h2 { margin-top:40px; }
table { width:100%; border-collapse:collapse; margin-top:20px; background:#2c2c2c; border-radius:10px; overflow:hidden; }
table th, table td { padding:12px 15px; text-align:left; border-bottom:1px solid #444; }
table th { background:linear-gradient(135deg,#ff416c,#ff4b2b); color:white; font-weight:bold; }
table tr:nth-child(even) { background:#292929; }
table tr:hover { background-color:#3a3a3a; }
input[type="month"], input[type="number"], select { padding:8px 12px; margin-right:10px; border-radius:5px; border:1px solid #444; background-color:#1e1e1e; color:white; }
button { background:linear-gradient(to right, #ff416c,#ff4b2b); color:white; border:none; padding:8px 16px; border-radius:5px; cursor:pointer; transition:0.3s; }
button:hover { background:linear-gradient(to right,#ff4b2b,#ff416c); }
canvas { background-color:#2c2c2c; margin-top:20px; border-radius:10px; padding:10px; }
.hidden { display:none; }
.chart-container { display:flex; flex-wrap:wrap; gap:20px; margin-top:20px; }
.chart-box { flex:1 1 100%; padding:10px; background:#2c2c2c; border-radius:10px; }
</style>
</head>
<body>

<div class="sidebar">
    <a href="transport.html"><i class="fas fa-truck"></i> Transport</a>
    <a href="transportReport.html" class="active"><i class="fas fa-file-alt"></i> Reports</a>
</div>

<div class="main-content">
<h1>Full Transport Report</h1>

<select id="filterType">
    <option value="month">Month</option>
    <option value="year">Year</option>
    <option value="all">All</option>
</select>
<input type="month" id="month">
<input type="number" id="yearPicker" placeholder="Enter Year" min="2000" max="2099" class="hidden">

<button id="generate-report">Generate Report</button>
<button onclick="exportToExcel()">Export to Excel</button>
<button onclick="exportToPDF()">Export to PDF</button>

<h2>Drivers</h2>
<table id="drivers-table">
<thead>
<tr><th>ID</th><th>Name</th><th>Phone</th><th>License No</th><th>Address</th><th>Created At</th></tr>
</thead>
<tbody></tbody>
</table>

<h2>Vehicles</h2>
<table id="vehicles-table">
<thead>
<tr><th>ID</th><th>Registration No</th><th>Model</th><th>Type</th><th>Capacity</th><th>Created At</th></tr>
</thead>
<tbody></tbody>
</table>

<h2>Petrol Bills</h2>
<table id="petrol-table">
<thead>
<tr><th>Bill ID</th><th>Driver</th><th>Vehicle</th><th>Date</th><th>Liters</th><th>Amount</th></tr>
</thead>
<tbody></tbody>
</table>

<h2>Vehicle Services</h2>
<table id="service-table">
<thead>
<tr><th>Service ID</th><th>Vehicle</th><th>Service Type</th><th>Service Date</th><th>Cost</th><th>Notes</th></tr>
</thead>
<tbody></tbody>
</table>

<h2>Combined Graph</h2>
<div class="chart-container">
    <div class="chart-box">
        <canvas id="combinedChart"></canvas>
    </div>
</div>

</div>

<script>
const filterType = document.getElementById('filterType');
const monthInput = document.getElementById('month');
const yearInput = document.getElementById('yearPicker');
const generateBtn = document.getElementById('generate-report');

const driversTbody = document.querySelector('#drivers-table tbody');
const vehiclesTbody = document.querySelector('#vehicles-table tbody');
const petrolTbody = document.querySelector('#petrol-table tbody');
const serviceTbody = document.querySelector('#service-table tbody');

let combinedChart;

filterType.addEventListener('change', () => {
    monthInput.classList.add('hidden');
    yearInput.classList.add('hidden');
    if(filterType.value==='month') monthInput.classList.remove('hidden');
    if(filterType.value==='year') yearInput.classList.remove('hidden');
});

generateBtn.addEventListener('click', () => {
    let url = 'get_full_transport_report.php';
    if(filterType.value==='month' && monthInput.value){
        const [y,m] = monthInput.value.split('-');
        url += `?year=${y}&month=${m}`;
    } else if(filterType.value==='year' && yearInput.value){
        url += `?year=${yearInput.value}`;
    }
    fetchReport(url);
});

async function fetchReport(url){
    try{
        const res = await fetch(url);
        const data = await res.json();

        // Clear tables
        driversTbody.innerHTML='';
        vehiclesTbody.innerHTML='';
        petrolTbody.innerHTML='';
        serviceTbody.innerHTML='';

        // Drivers table
        if(data.drivers.length===0) driversTbody.innerHTML='<tr><td colspan="6">No records found</td></tr>';
        data.drivers.forEach(d=>{
            const tr=document.createElement('tr');
            tr.innerHTML=`<td>${d.driver_id}</td><td>${d.name}</td><td>${d.phone}</td><td>${d.license_no}</td><td>${d.address}</td><td>${d.created_at}</td>`;
            driversTbody.appendChild(tr);
        });

        // Vehicles table
        if(data.vehicles.length===0) vehiclesTbody.innerHTML='<tr><td colspan="6">No records found</td></tr>';
        data.vehicles.forEach(v=>{
            const tr=document.createElement('tr');
            tr.innerHTML=`<td>${v.vehicle_id}</td><td>${v.registration_no}</td><td>${v.model}</td><td>${v.type}</td><td>${v.capacity}</td><td>${v.created_at}</td>`;
            vehiclesTbody.appendChild(tr);
        });

        // Petrol table
        if(data.petrol_bills.length===0) petrolTbody.innerHTML='<tr><td colspan="6">No records found</td></tr>';
        data.petrol_bills.forEach(p=>{
            const tr=document.createElement('tr');
            tr.innerHTML=`<td>${p.bill_id}</td><td>${p.driver_name}</td><td>${p.vehicle_reg}</td><td>${p.date}</td><td>${p.liters}</td><td>${p.amount}</td>`;
            petrolTbody.appendChild(tr);
        });

        // Service table
        if(data.vehicle_services.length===0) serviceTbody.innerHTML='<tr><td colspan="6">No records found</td></tr>';
        data.vehicle_services.forEach(s=>{
            const tr=document.createElement('tr');
            tr.innerHTML=`<td>${s.service_id}</td><td>${s.vehicle_reg}</td><td>${s.service_type}</td><td>${s.service_date}</td><td>${s.cost}</td><td>${s.notes}</td>`;
            serviceTbody.appendChild(tr);
        });

        // Combined Chart
        if(combinedChart) combinedChart.destroy();
        combinedChart = new Chart(document.getElementById('combinedChart'), {
            type:'bar',
            data:{
                labels:['Drivers','Vehicles','Petrol Amount','Service Cost'],
                datasets:[
                    { label:'Count / Amount', data:[
                        data.drivers.length,
                        data.vehicles.length,
                        data.petrol_bills.reduce((sum,p)=>sum+parseFloat(p.amount),0),
                        data.vehicle_services.reduce((sum,s)=>sum+parseFloat(s.cost),0)
                    ], backgroundColor:['#facc15','#a78bfa','#4ade80','#60a5fa'] }
                ]
            },
            options:{
                responsive:true,
                plugins:{ legend:{ display:false } },
                scales:{ y:{ beginAtZero:true } }
            }
        });

    } catch(err){
        console.error(err);
        driversTbody.innerHTML='<tr><td colspan="6">Error fetching data</td></tr>';
        vehiclesTbody.innerHTML='<tr><td colspan="6">Error fetching data</td></tr>';
        petrolTbody.innerHTML='<tr><td colspan="6">Error fetching data</td></tr>';
        serviceTbody.innerHTML='<tr><td colspan="6">Error fetching data</td></tr>';
    }
}

// Export functions
async function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("p","mm","a4");
    const canvas = await html2canvas(document.querySelector('.main-content'));
    const imgData = canvas.toDataURL("image/png");
    const imgWidth = 190;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    doc.addImage(imgData,"PNG",10,10,imgWidth,imgHeight);
    doc.save("Transport_Report.pdf");
}

function exportToExcel(){
    const tables = ['drivers-table','vehicles-table','petrol-table','service-table'];
    const wb = XLSX.utils.book_new();
    tables.forEach(id=>{
        const table = document.getElementById(id);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.table_to_sheet(table), id.replace('-table',''));
    });
    XLSX.writeFile(wb,"Transport_Report.xlsx");
}
</script>
</body>
</html>
